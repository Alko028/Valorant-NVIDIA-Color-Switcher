# VALORANT / Riot Client NVIDIA 颜色自动切换配置
# 数值与 NVIDIA 控制面板滑块一致。保存此文件后，程序会自动重新加载。

# 检测频率与防止游戏重置颜色的重新应用频率
PollMilliseconds=1000
ReapplySeconds=10

# true = 所有 NVIDIA 显示器；false = 只调整 Windows 主显示器
ApplyToAllNvidiaDisplays=true

# 游戏进程：只要任意一个正在运行，就使用游戏颜色
GameProcesses=VALORANT-Win64-Shipping;VALORANT

# Riot 客户端：默认只在客户端窗口可见且没有最小化时触发。
# 这样退出游戏后，即使 Riot 留在后台托盘，也能恢复桌面颜色。
RiotClientProcesses=RiotClientUx
RiotClientRequiresVisibleWindow=true

# 是否在切换时显示 Windows 通知
ShowNotifications=false

# 图 1：游戏颜色
GameBrightness=65
GameContrast=65
GameGamma=1.10
GameVibrance=60
GameHue=0

# 图 2：桌面颜色
DesktopBrightness=50
DesktopContrast=50
DesktopGamma=1.00
DesktopVibrance=50
DesktopHue=0
